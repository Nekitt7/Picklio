function collectionPayload(e){const answers={},weights={},mandatory={},settings={};const answerKeys=['budget','use','camera','games','battery','size','type','surface','pets','area','extra'];for(const k of answerKeys){if(e.answers?.[k]!==undefined)answers[k]=e.answers[k];if([1,2,3].includes(e.weights?.[k]))weights[k]=e.weights[k];if(['size','type','surface','extra'].includes(k)&&typeof e.mandatory?.[k]==='boolean')mandatory[k]=e.mandatory[k]}

return {name:e.name,sessionId:e.sessionId,eventId:e.eventId,category:e.category,answers,weights,mandatory,settings,recommendations:Array.isArray(e.recommendations)?e.recommendations.slice(0,3):[],...(e.value?{value:e.value}:{})}}

function rememberAiJob(payload,job){if(!/^[a-f0-9]{64}$/.test(job?.id))return;const key=JSON.stringify(payload);aiKnownJobs=aiKnownJobs.filter(x=>x.key!==key);aiKnownJobs.push({key,id:job.id,savedAt:Date.now()});aiKnownJobs=aiKnownJobs.slice(-20);try{localStorage.setItem('picklio-ai-jobs',JSON.stringify(aiKnownJobs))}catch{}}
async function readAiJob(endpoint,id){if(!/^[a-f0-9]{64}$/.test(id))throw Error('invalid_job');const response=await fetch(endpoint.href+'/'+id,{credentials:'omit',signal:AbortSignal.timeout(25000)});if(!response.ok)throw Error('ai_unavailable');return response.json()}
async function submitAiJob(endpoint,payload){
 const key=JSON.stringify(payload),known=aiKnownJobs.find(x=>x.key===key);
 if(known){const previous=await readAiJob(endpoint,known.id);if(previous.status!=='blocked'||previous.error!=='ai_budget_exhausted')return previous;aiKnownJobs=aiKnownJobs.filter(x=>x.key!==key)}
 if(aiPendingSubmissions.has(key))return aiPendingSubmissions.get(key);
 const pending=(async()=>{const response=await fetch(endpoint.href,{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:key,signal:AbortSignal.timeout(25000)});const job=await response.json();if(!response.ok)throw Error(job.error||'ai_unavailable');rememberAiJob(payload,job);return job})();

}

function productLink(value){try{
 const u=new URL(value),h=u.hostname.toLowerCase().replace(/^www\./,''),p=u.pathname;
 if(u.protocol!=='https:'||u.username||u.password||u.port||!h.includes('.')||/^[\d.]+$/.test(h)||/[\[\]:]/.test(h)||/(?:^|\.)(?:localhost|local|internal|test|invalid)$/.test(h))return null;
 if([...u.searchParams.keys()].some(k=>/^(?:token|api_key|signature|auth|access_token|q|query|search|text)$/i.test(k)))return null;
 const at=d=>h===d||h.endsWith('.'+d);let store;
 if(at('ozon.ru')||at('ozon.com')){if(!/^\/product\/(?:[^/]*-)?\d{4,}\/?$/i.test(p))return null;store='Ozon'}
 else if(at('wildberries.ru')||at('wildberries.by')||at('wildberries.kz')){if(!/^\/catalog\/\d{4,}\/detail\.aspx$/i.test(p))return null;store='Wildberries'}
 else if(at('aliexpress.ru')||at('aliexpress.com')){if(!/^\/item\/\d{5,}\.html$/i.test(p))return null;store='AliExpress'}
 else if(at('market.yandex.ru')){if(!/^\/(?:product--|card\/)[^/]+\/\d{4,}\/?$/i.test(p))return null;store='Яндекс Маркет'}
 else{
  if(/(?:^|\/)(?:search|searchpage|articles?|blog|reviews?|ratings?|news|brands?)(?:\/|$)/i.test(p))return null;
  if(!/^\/(?:[^/]+\/){0,2}(?:products?|item|goods|shop\/details|cat\/detail)\/[^/]{5,}(?:\/[^/]+)?\/?$/i.test(p))return null;
  store=h;
 }
 for(const key of [...u.searchParams.keys()])if(/^(?:utm_|from$|ref$|ref_|yclid$|gclid$)/i.test(key))u.searchParams.delete(key);
 u.hash='';return {url:u.href,store,kind:'product_card',verificationStatus:'search_cited_product_url_not_live_offer'};
}catch{return null}}
