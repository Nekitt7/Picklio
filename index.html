if(state.screen==='quiz'){const qs=questions();state.step=Math.min(state.step,qs.length-1);const q=qs[state.step];app.innerHTML=`<section class="quiz"><div class="crumb"><button class="link" onclick="goHome()">← Категории</button><span class="small">${state.cat==='phone'?'Смартфон':'Пылесос'} · ${state.step+1} из ${qs.length}</span></div><div class="progress" role="progressbar" aria-label="Прогресс опроса" aria-valuenow="${state.step+1}" aria-valuemin="0" aria-valuemax="${qs.length}"><div style="width:${(state.step+1)/qs.length*100}%"></div></div><div class="question-tools"><span class="eyebrow">Подстроим выбор под вас</span>${q.budget?'':weightHTML(q)}</div><h1 tabindex="-1" id="questionTitle">${q.title}</h1><p>${q.desc}</p>${q.budget?`<label class="budget"><input id="budget" type="number" min="1" max="10000000" step="1" aria-label="Максимальный бюджет в рублях" value="${state.answers.budget}"><span>₽</span></label><div class="presets">${(state.cat==='phone'?[20000,40000,70000]:[15000,30000,50000]).map(n=>`<button onclick="setBudget(${n})">${money(n)}</button>`).join('')}</div><p id="budgetError" class="error" aria-live="polite"></p>`:`<div class="options" role="radiogroup" aria-labelledby="questionTitle">${q.options.map(([v,label,sub])=>`<button role="radio" aria-checked="${state.answers[q.key]===v}" class="option ${state.answers[q.key]===v?'selected':''}" onclick="choose('${q.key}','${v}')"><span class="radio"></span><span>${label}${sub?`<small>${sub}</small>`:''}</span></button>`).join('')}</div>`}${!q.budget&&['size','type','surface','extra'].includes(q.key)?mandatoryHTML(q):''}${state.step===0?'<div class="notice"><strong>Ответ и важность — разные вещи.</strong> Вы выбираете пожелание, а у каждого следующего вопроса отмечаете: 1 — неважно, 2 — важно, 3 — очень важно. По умолчанию — «Важно». Ответы и важность сохраняются при возврате.</div>'+settingsHTML():''}<div class="nav"><button class="secondary" onclick="back()">← ${state.step?'Назад':'Категории'}</button><button id="next" class="primary" onclick="next()" ${!q.budget&&!state.answers[q.key]?'disabled':''}>${state.step===qs.length-1?'Показать подбор':'Продолжить'} →</button></div><p class="small">${q.budget?'В демо бюджет строго сравнивается с учебным порогом модели. Это не проверка рыночной цены.':'Выбираем только в демонстрационном каталоге.'}</p></section>`;bindSettings();if(q.budget)$('budget').addEventListener('input',()=>{state.answers.budget=Number($('budget').value);$('budgetError').textContent=''});return}renderResults()}
function weightHTML(q){const v=state.weights[q.key]||2;return '<fieldset class="importance" '+(state.mandatory[q.key]?'disabled':'')+'><legend>Важность</legend>'+[1,2,3].map(n=>'<button type="button" aria-pressed="'+(v===n)+'" onclick="setWeight(\''+q.key+'\','+n+')" title="'+['','Неважно — не влияет на порядок','Важно — учитываем','Очень важно — влияет сильнее'][n]+'">'+n+' <span>'+['','Неважно','Важно','Очень важно'][n]+'</span></button>').join('')+'</fieldset>'}
function setWeight(key,n){state.weights[key]=n;render()}
function mandatoryHTML(q){return '<label class="required-control"><input type="checkbox" '+(state.mandatory[q.key]?'checked':'')+' onchange="setMandatory(\''+q.key+'\',this.checked)"> Это обязательное условие — исключить остальные варианты</label><p class="small">Без отметки ответ влияет только на порядок и может иметь важность «Неважно».</p>'}
function setMandatory(key,v){state.mandatory[key]=v;render()}
function weight(key){return state.weights[key]===1?0:state.weights[key]===3?4:1}
function bindSettings(){document.querySelectorAll('[data-setting]').forEach(el=>el.addEventListener('change',()=>{state.settings[el.dataset.setting]=el.value}))}
function setBudget(n){state.answers.budget=n;$('budget').value=n;$('budgetError').textContent=''}
function choose(key,value){state.answers[key]=value;state.weights[key]??=2;if(key==='use'&&value==='photo'){delete state.answers.camera}if(key==='use'&&value==='games'){delete state.answers.games}if(key==='type')delete state.answers.extra;render()}
function back(){if(state.step>0){state.step--;render()}else goHome()}
function next(){const qs=questions(),q=qs[state.step];if(q.budget&&(!Number.isInteger(state.answers.budget)||state.answers.budget<1||state.answers.budget>10000000)){$('budgetError').textContent='Введите целую сумму от 1 до 10 000 000 ₽.';$('budget').focus();return}if(!q.budget&&!state.answers[q.key])return;if(state.step<qs.length-1){state.step++;render();$('questionTitle').focus();window.scrollTo(0,0)}else{state.screen='results';state.feedback=null;track('quiz_complete',{category:state.cat,answers:{...state.answers},weights:{...state.weights},mandatory:{...state.mandatory},settings:{...state.settings}});track('recommendations_view',{category:state.cat,count:rank().length,answers:{...state.answers},weights:{...state.weights},mandatory:{...state.mandatory},settings:{...state.settings},recommendations:rank().map(p=>p.id)});render();window.scrollTo(0,0)}}
function suitableOffers(p){const s=state.settings;return offers.filter(o=>o.productId===p.id&&o.price<=state.answers.budget&&o.region===s.region&&(s.channel==='any'||s.channel===o.channel)&&(s.condition==='any'||s.condition===o.condition)&&(s.delivery!=='yes'||o.delivery))}
function cameraRequested(){return state.cat==='phone'&&((state.answers.use==='photo'&&weight('use')>0)||(state.answers.camera==='high'&&weight('camera')>0))}
function cameraFocus(){return cameraRequested()}
function cameraEvidence(p){return p.cameraReview?`<p class="review-score"><strong>DXOMARK Camera V5: ${p.cameraReview.score}</strong><br>Тест: 21.11.2024 · проверено 28.10.2026<br><a href="${p.cameraReview.url}" target="_blank" rel="noopener noreferrer">Источник оценки ↗</a><br><small>С V6 не сравниваем. Одной оценки недостаточно для рейтинга.</small></p>`:''}

function rank(){const a=state.answers,m=state.mandatory,w=weight;return catalog.filter(p=>p.cat===state.cat).map(p=>({...p,offer:suitableOffers(p).sort((x,y)=>x.price-y.price)[0]})).filter(p=>p.offer).filter(p=>{
if(state.cat==='phone')return !m.size||!['compact','large'].includes(a.size)||p.size===a.size;
if(m.type&&['robot','stick','classic'].includes(a.type)&&p.type!==a.type)return false;
if(m.surface&&a.surface==='carpet'&&p.carpet<4)return false;
if(m.surface&&a.surface==='mixed'&&p.carpet<2)return false;
if(m.extra&&a.extra==='wet'&&!p.wet)return false;
return true}).filter(p=>!cameraRequested()||!!p.cameraReview).map(p=>{let score=0,reasons=[];
if(state.cat==='phone'){
let cam=(a.use==='photo'?4*w('use'):0)+(a.camera==='high'?4*w('camera'):a.camera==='normal'?w('camera'):0);
let game=(a.use==='games'?4*w('use'):0)+(a.games==='high'?4*w('games'):a.games==='normal'?w('games'):0);
let bat=a.battery==='high'?4*w('battery'):a.battery==='normal'?w('battery'):0;
if(a.use==='daily'){cam+=w('use');game+=w('use');bat+=w('use')}
score=p.games*game+p.battery*bat; // Camera is not numerically combined until a comparable dataset and scale are established.
if(['compact','large'].includes(a.size)&&p.size===a.size){score+=5*w('size');if(w('size')||m.size)reasons.push(p.size==='compact'?'Выбранный компактный размер':'Выбранный большой экран')}
if(cam>0&&p.cameraReview)reasons.push('DXOMARK Camera V5: '+p.cameraReview.score+'; сравнимых оценок остальных пока нет');if(cam>0)reasons.push(p.cameraFact);if(game>0)reasons.push(p.gameFact);if(bat>0)reasons.push(p.batteryFact);
}else{
if(['robot','stick','classic'].includes(a.type)&&p.type===a.type){score+=6*w('type');if(w('type')||m.type)reasons.push('Выбранный формат: '+(p.type==='robot'?'робот':p.type==='stick'?'вертикальный':'проводной'))}
if(a.surface==='carpet'||a.surface==='mixed'){score+=p.carpet*(a.surface==='carpet'?4:2)*w('surface');if(w('surface')>0)reasons.push(p.carpet>=4?'Есть насадка для ковров; результат на вашем ворсе нужно проверить':'Густые ковры — компромисс: пригодность не подтверждена')}
if(a.surface==='hard'){score+=p.wet*2*w('surface')}
if(a.pets==='yes'){score+=p.pets*4*w('pets');if(w('pets')>0)reasons.push(p.pets>=4?'Есть щётка для сбора волос / шерсти (по комплектации)':'Сбор шерсти не подтверждён сравнительным тестом')}
if(a.area==='large'){score+=p.area*4*w('area');if(w('area')>0)reasons.push(p.type==='classic'?'Работает от сети без подзарядки':'Реальная площадь зависит от режима и планировки')}
if(a.area==='small')score+=p.light*w('area');
if(a.extra==='wet'){score+=(p.wet?8:0)*w('extra');if(w('extra')||m.extra)reasons.push(p.wet?'Есть влажная уборка':'Влажной уборки нет — компромисс по пожеланию')}
if(a.extra==='light'){score+=p.light*4*w('extra');if(w('extra'))reasons.push(p.light>=4?'В учебной логике выше за удобство перемещения':'Вес — компромисс, проверьте массу в характеристиках')}
}
if(!reasons.length)reasons.push('Важные пожелания не заданы: порядок по учебной сумме');
reasons.push('Проходит тестовый порог бюджета; реальная цена неизвестна');
return {...p,score,reasons:reasons.slice(0,4)}}).sort((a,b)=>b.score-a.score||a.offer.price-b.offer.price).slice(0,3)}

function edit(i){state.screen='quiz';state.step=i;render();window.scrollTo(0,0)}
function renderResults(){const ps=rank();$('app').innerHTML=`<section class="results"><div class="result-head"><div><span class="eyebrow">${cameraFocus()?'DXOMARK Camera · данные пока неполные':ps.length?'Меньше вариантов — легче решить':'Условия оказались слишком строгими'}</span><h1>${cameraFocus()?ps.length?'Один кандидат с подтверждённой оценкой':'Для этих условий данных не хватает':ps.length?'Вот с чего стоит начать':'Подходящих вариантов нет'}</h1><p>${cameraFocus()?'Выбран DXOMARK Camera V5. Подтверждена 1 оценка из 7 моделей: этого недостаточно для рейтинга качества камеры. Отсутствие оценки не означает плохую камеру.':ps.length?`Нашли ${ps.length===3?'основной вариант и две альтернативы':ps.length===2?'основной вариант и одну альтернативу':'один подходящий вариант'}. ${ps.length<3?'Остальные не прошли ваши ограничения.':'Выбор основан на ваших ответах.'}`:'В нашем небольшом демокаталоге — это не вывод обо всём рынке.'}</p></div><button class="secondary" onclick="edit(0)">Изменить условия</button></div><div class="answerchips">${questions().map((q,i)=>({q,i})).filter(({q})=>state.answers[q.key]!==undefined).map(({q,i})=>`<button onclick="edit(${i})" title="Изменить ответ">${q.budget?money(state.answers.budget):esc(q.options.find(o=>o[0]===state.answers[q.key])?.[1]||'Не указано')+(state.mandatory[q.key]?' · обязательно':' · '+['','неважно','важно','очень важно'][state.weights[q.key]||2])} ✎</button>`).join('')}</div><div class="notice"><strong>Демонстрационный результат.</strong> Модели реальные; источники характеристик есть в карточках. Суммы — придуманные тестовые пороги, а не рыночные цены. Соответствие реальному бюджету и наличие не подтверждены. ${state.settings.city?'Регион: '+esc(state.settings.city)+'. Местные предложения не проверены.':''} ${state.settings.condition==='any'?'Показаны только новые модели: б/у объявления не подключены.':''}</div>${cameraRequested()?'<div class="notice camera-note"><strong>Для камеры выбран DXOMARK Camera.</strong> Проверен iPhone 16: 147 баллов, V5, тест 21.11.2024. С оценками V6 не смешиваем. Для Redmi Note 14, Galaxy A56, S25, S25 Ultra, POCO X7 Pro и базового Pura 70 сопоставимые оценки в прототипе не заполнены: их качество неизвестно, не равно нулю. Они могут оказаться лучше показанного кандидата. При активном пожелании камеры рейтинг не строим и победителя не выбираем. <a href="https://www.dxomark.com/apple-iphone-16-camera-test/" target="_blank" rel="noopener noreferrer">Подтверждённый тест ↗</a> · <a href="https://dxomark.com/smartphones/" target="_blank" rel="noopener noreferrer">Ограничение V5/V6 ↗</a><br>PhoneArena сохранён отдельно как дополнительный демонабор и в подборе не используется. Важность камеры сохраняется; для её численного влияния ещё нужно заполнить сопоставимый набор.</div>':''}${ps.length?`<div class="recommendations">${ps.map((p,i)=>`<article class="product ${i===0&&!cameraRequested()?'best':''}"><div class="label">${cameraRequested()?'Кандидат · рейтинг не построен':i===0?'↗ По доступным данным':'Альтернатива '+i}</div><div class="product-visual">${art(state.cat)}<span class="visual-note">Условная иллюстрация</span></div><h3>${p.name}</h3><span class="small">${p.tag} · ${p.version}</span><div class="price">${money(p.offer.price)}<small>учебный порог бюджета · не цена</small></div><ul class="reasons">${p.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')}</ul>${cameraEvidence(p)}${p.facts?`<p class="small" style="margin-top:8px">${esc(p.facts)}</p>`:''}<a class="small" style="margin-bottom:17px" href="${p.source}" target="_blank" rel="noopener noreferrer">Характеристики производителя ↗</a><p class="tradeoff"><strong>Что учесть</strong><br>${p.trade}</p><button class="secondary" onclick="showOffers('${p.id}')">Данные и макет покупки →</button></article>`).join('')}</div><p class="small">Порядок по остальным пожеланиям рассчитан по учебным весам, без языковой модели. Для камеры выбран DXOMARK Camera, но пока подтверждена только одна оценка V5. Численный вклад качества камеры не вычисляется до заполнения сопоставимых результатов и выбора шкалы. При важной камере показывается неполное покрытие без победителя. Остальные веса пока учебные. Это предположения для проверки логики, а не измеренное качество камеры, FPS или тест уборки. Ёмкость батареи не равна автономности. Важность 1 исключает пожелание из оценки, 2 учитывает его, 3 усиливает. Отмеченные обязательными условия фильтруют модели независимо от важности. Бюджет сравнивается только с тестовым порогом. При равных баллах выше меньший учебный порог.</p><div class="feedback"><span>Подбор помог сузить выбор?</span><button aria-pressed="${state.feedback==='yes'}" onclick="feedback('yes')">Да, помог</button><button aria-pressed="${state.feedback==='no'}" onclick="feedback('no')">Пока нет</button><span class="small" aria-live="polite">${state.feedback?'Спасибо! Ответ сохранён на этом устройстве.':''}</span></div>`:`<div class="empty"><h2>${cameraRequested()?'В этом бюджете нет заполненных тестов камеры':state.settings.condition==='used'?'Б/у объявления пока не подключены':'Попробуем немного изменить условия?'}</h2><p>${cameraRequested()?'Это пробел в данных, не отсутствие подходящих смартфонов. Неизвестные оценки не подменяем мегапикселями или придуманными баллами. Можно уменьшить важность камеры до «Неважно», чтобы проверить подбор по остальным пожеланиям.':state.settings.condition==='used'?'Для б/у важны состояние и история конкретного экземпляра. Мы не проверяли объявления и не можем рекомендовать покупку по одной модели. Можно посмотреть ориентиры среди новых устройств.':state.settings.region!=='Россия'?'В демо есть предложения только для России. Для вашей страны каталог ещё не подключён.':state.answers.budget<9000?'В каталоге нет моделей с таким учебным бюджетным порогом. Реальные цены неизвестны. Можно увеличить сумму или вернуться к выбору категории.':'Можно увеличить бюджет, выбрать другой формат или пересмотреть обязательные функции. Мы не будем незаметно ослаблять ваши условия.'}</p><button class="primary" onclick="edit(0)">Изменить условия</button></div>`}${state.cat==='phone'?`<div class="notice" style="margin-top:20px"><strong>Каталог неполный.</strong> Отсутствие модели не означает, что она хуже. Есть кандидат для проверки HUAWEI Pura 70 (базовый, не Pro/Ultra): переменная диафрагма, OIS и отдельная 5× камера подтверждены <a href="https://consumer.huawei.com/sg/phones/pura70/specs/" target="_blank" rel="noopener noreferrer">производителем</a>. Цена не подключена, поэтому соответствие вашему бюджету неизвестно и модель не участвует в бюджетной выдаче. Сопоставимого испытания камеры базового Pura 70 в этой версии нет; оценку Ultra ему не присваиваем.</div>`:''}<button class="link" onclick="goHome()">← Подобрать другую категорию</button></section>`}
function feedback(value){state.feedback=value;track('recommendation_feedback',{value,category:state.cat,answers:{...state.answers},weights:{...state.weights},mandatory:{...state.mandatory},settings:{...state.settings},recommendations:rank().map(p=>p.id)});render()}
function modal(html){$('modalBody').innerHTML=html;if(!$('modal').open)$('modal').showModal()}
function showOffers(id){const p=catalog.find(x=>x.id===id);const os=suitableOffers(p);modal(`<h2>${p.name}</h2><p>${esc(p.version)}. <a href="${p.source}" target="_blank" rel="noopener noreferrer">Официальные характеристики ↗</a></p><p>Это макет карточки предложения. Модель реальная. Ниже вымышленные магазины и тестовые суммы. Это не предложения о продаже; текущая цена и возможность покупки не подтверждены.</p>${os.map(o=>`<div class="offer"><strong>${o.seller}</strong><span>${money(o.price)} · новое · ${o.delivery?'условная доставка':'условная витрина'}</span><br><button class="link" style="margin-top:10px" onclick="sellerDemo('${o.id}')">Проверить демо-переход →</button></div>`).join('')}<p id="sellerStatus" aria-live="polite" class="small">Реальных ссылок продавцов в прототипе нет. География доставки и наличие на витрине не проверены.</p>`)}
function sellerDemo(id){track('seller_click_demo',{offerId:id,category:state.cat});$('sellerStatus').textContent='Демо-переход записан локально. В рабочем сервисе здесь откроется предложение подключённого продавца. Покупка не отслеживается.'}
function showAbout(){modal('<h2>Понятный подбор</h2><p>Сначала исключаем варианты, нарушающие тестовый бюджет, условия покупки и только те пожелания, которые вы отдельно отметили обязательными.</p><p>Затем сортируем оставшиеся модели по приоритетам: камера, игры, батарея; для пылесосов — покрытия, шерсть, площадь и удобство. Веса свойств — учебные предположения разработчика, не результаты сравнительных испытаний. Их нужно откалибровать после тестов.</p><p>Модели реальные, источники производителей указаны в карточках. Макеты магазинов и бюджетные пороги вымышлены. Здесь нет поиска по всему рынку, проверенных цен и проверки б/у экземпляров.</p><p>В будущем модель товара сможет иметь характеристики производителя и несколько отдельных предложений магазинов. До подключения источников использовать прототип для реальной покупки не стоит.</p>')}
const eventNames={quiz_start:'Начало опроса',quiz_complete:'Завершение опроса',recommendations_view:'Просмотр рекомендаций',seller_click_demo:'Демо-переход к продавцу',recommendation_feedback:'Оценка подбора'};
function showEvents(){modal(`<h2>События на этом устройстве</h2><p>Только локальный журнал последних 500 событий этого браузера. Общей статистики и отслеживания покупок нет. Ничего не отправляется на сервер. Ответы на завершённые опросы сохраняются здесь до очистки.</p><div class="events">${events.length?events.slice().reverse().map(e=>`<div class="event"><strong>${eventNames[e.name]||esc(e.name)}</strong><br>${new Date(e.time).toLocaleString('ru-RU')}${e.category?' · '+(e.category==='phone'?'Смартфон':'Пылесос'):''}${e.value?' · '+(e.value==='yes'?'Помог':'Не помог'):''}</div>`).join(''):'Событий пока нет. Начните подбор.'}</div><div class="nav"><button class="secondary" onclick="downloadEvents()">Скачать JSON</button><button class="link" onclick="clearEvents()">Очистить журнал</button></div>`)}
function clearEvents(){events=[];try{localStorage.removeItem('kstati-events')}catch{}showEvents()}
function downloadEvents(){const url=URL.createObjectURL(new Blob([JSON.stringify(events,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='kstati-local-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}});
render();
</script></body></html>
